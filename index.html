<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h2>Student Addmission Form.</h2>
        <p>Fill the form to apply for admission in cources.</p>
        <br>
        <label>Username: <input type="text"></label>
        <br><br>
        <label>Password: <input type="password"></label>
        <br><br>
        <label>Date Of Birth: <input type="date"></label>
        <br><br>
        <label>Contact No: <input type="number"></label>
        <br><br>
        <label>Address: <textarea placeholder="" cols="20" rows="2"></textarea></label>
        <br><br>
        <label>Gender:</label>
        <label><input type="radio" name="gender" value="male">Male</label>
        <label><input type="radio" name="gender" value="female">Female</label>
        <br><br>
        <label>Cources:</label>
        <label><input type="checkbox">Web Development</label>
        <label><input type="checkbox">AI</label>
        <label><input type="checkbox">Graphic Desinging</label>
        <label><input type="checkbox">Cyber Security</label>
        <br><br>
        <label>Feedback</label>
        <textarea placeholder="Say Anything...." cols="30" rows="4"></textarea>
        <br><br>
        <button>Submit</button>
    </form>
</body>
</html>
